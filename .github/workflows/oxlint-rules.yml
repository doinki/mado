name: Sync Oxlint Rules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: oxlint-rules
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node packages/oxlint/scripts/crawl.js
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-oxlint-rules
          commit-message: 'chore(oxlint): Sync upstream rules'
          title: 'chore(oxlint): Sync upstream rules'
          body: |
            Syncs rule metadata from the `main` branch of `oxc-project/website`.
            Stores each scope's rules in a separate JSON file under `packages/oxlint/upstream`.
          add-paths: packages/oxlint/upstream
