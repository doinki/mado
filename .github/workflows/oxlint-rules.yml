name: Sync Oxlint Rules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: oxlint-rules
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-install

      - name: Sync rules and prepare the package release
        working-directory: packages/mado-oxlint
        shell: bash
        run: |
          pnpm run crawl
          pnpm run generate
          if [[ -z "$(git status --porcelain -- src)" ]]; then
            exit 0
          fi

          pnpm add --save-peer oxlint@latest
          pnpm run typecheck
          for preset in src/*.ts; do
            ./node_modules/.bin/oxlint --config "$preset" --print-config > /dev/null
          done

          oxlint_range=$(pnpm pkg get peerDependencies.oxlint)
          cat > "$GITHUB_WORKSPACE/.changeset/oxlint-rules-${GITHUB_SHA:0:12}.md" <<EOF
          ---
          '@mado/oxlint': minor
          ---

          Sync the built-in rule presets and require oxlint ${oxlint_range}.
          EOF

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-oxlint-rules
          commit-message: 'chore(oxlint): Sync upstream rules'
          title: 'chore(oxlint): Sync upstream rules'
          body: Syncs upstream rule snapshots. When a preset changes, this PR also updates Oxlint dependencies and includes a changeset for `@mado/oxlint`.
          add-paths: packages/mado-oxlint, pnpm-lock.yaml, .changeset
